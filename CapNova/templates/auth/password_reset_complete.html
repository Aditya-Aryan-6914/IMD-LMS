{% extends 'base.html' %}
{% load static %}
{% block title %}Password reset complete{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/register.css' %}">
<main class="register-main">
  <img src="{{ hero_image_url|default:'/static/assets/imd-registration-hero.png' }}" alt="" class="hero-bg" />
  <div class="hero-overlay"></div>
  <div class="content-wrap">
    <div class="content-grid">
      <div class="hero-copy">
        <p class="eyebrow">GOVERNMENT OF INDIA</p>
        <h1>Training &amp; Capacity<br />Building Portal</h1>
      </div>
      <div class="register-card">
        <h2>Password changed</h2>
        <p class="subtitle">Your password has been updated. You can now log in.</p>
        <p class="login-hint"><a href="{% url 'login' %}">Go to log in</a></p>
      </div>
    </div>
  </div>
</main>
{% endblock %}
