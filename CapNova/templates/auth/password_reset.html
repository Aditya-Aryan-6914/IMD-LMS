{% extends 'base.html' %}
{% load static %}
{% block title %}Reset password{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/register.css' %}">
<main class="register-main">
  <img src="{{ hero_image_url|default:'/static/assets/imd-registration-hero.png' }}" alt="" class="hero-bg" />
  <div class="hero-overlay"></div>
  <div class="content-wrap">
    <div class="content-grid">
      <div class="hero-copy">
        <p class="eyebrow">GOVERNMENT OF INDIA</p>
        <h1>Training &amp; Capacity<br />Building Portal</h1>
      </div>
      <div class="register-card">
        <h2>Reset your password</h2>
        <p class="subtitle">Enter your account email and we'll send you a reset link.</p>
        <form method="post" class="register-form" novalidate>
          {% csrf_token %}
          <div class="form-field">
            <label for="id_email">Email address</label>
            <input type="email" id="id_email" name="email" required placeholder="name@imd.gov.in" />
          </div>
          <button type="submit" class="submit-btn">Send reset link</button>
        </form>
        <p class="login-hint"><a href="{% url 'login' %}">Back to log in</a></p>
      </div>
    </div>
  </div>
</main>
{% endblock %}
